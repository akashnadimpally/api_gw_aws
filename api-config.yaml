name: "private-api"
regions: ["us-east-1", "us-east-2"]
stage_name: "prod"
private_api: true

resources:
  - path: "data"
    methods:
      - http_method: "GET"
        integration_type: "HTTP_PROXY"
        uri: "http://nlb_dns_placeholder/data"
        request_validator: "ALL"
        throttling:
          rate_limit: 100
          burst_limit: 50

  - path: "process"
    methods:
      - http_method: "POST"
        integration_type: "AWS_PROXY"
        uri: "arn:aws:apigateway:${region}:lambda:path/2015-03-31/functions/${lambda_arn}/invocations"
        request_model: "ProcessorRequest"
        throttling:
          rate_limit: 200
          burst_limit: 100

models:
  ProcessorRequest:
    schema: >
      {
        "$schema": "http://json-schema.org/draft-04/schema#",
        "title": "ProcessorRequest",
        "type": "object",
        "properties": {
          "input": {"type": "string"}
        }
      }