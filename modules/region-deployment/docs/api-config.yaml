resources:
  - path: "v1/data"
    methods:
      - http_method: "GET"
        integration_type: "ECS_PROXY"
        service_name: "data-service"
        throttling:
          rate_limit: 100
          burst_limit: 50

  - path: "v3/loan/{person_id}"
    methods:
      - http_method: "GET"
        integration_type: "EKS_PROXY"
        service_name: "loan-service"
        request_parameters:
          "method.request.path.person_id": true
        throttling:
          rate_limit: 200
          burst_limit: 100

  - path: "v2/loans/statements/credit_report/{id}"
    methods:
      - http_method: "GET"
        integration_type: "LAMBDA_PROXY"
        service_name: "credit-report-lambda"
        request_parameters:
          "method.request.path.id": true
