openapi: 3.0.1
info:
  title: Stateless FastAPI Example
  version: "1.0"
paths:
  /:
    get:
      summary: Serve index.html from S3
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string
      x-amazon-apigateway-integration:
        type: aws
        uri: arn:aws:apigateway:${AWS::Region}:s3:path/your-bucket-name/index.html
        httpMethod: GET
        credentials: arn:aws:iam::${AWS::AccountId}:role/APIGW-S3-Access-Role
        passthroughBehavior: when_no_match
        integrationResponses:
          - statusCode: 200
            responseParameters:
              method.response.header.Content-Type: "'text/html'"
      security: []  # or apply your existing securitySchemes here
  /hello:
    get:
      summary: Greet a user
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            default: World
      responses:
        '200':
          description: Successful greeting
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /add:
    get:
      summary: Add two numbers
      parameters:
        - name: a
          in: query
          required: true
          schema:
            type: integer
        - name: b
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Addition result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: integer
  /reverse:
    post:
      summary: Reverse a string
      parameters:
        - name: text
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reversed string
          content:
            application/json:
              schema:
                type: object
                properties:
                  reversed:
                    type: string
  /status:
    get:
      summary: Health check
      responses:
        '200':
          description: Status OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /lambda/{path}:
    get:
      summary: Catch-all dynamic path
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Echo dynamic path
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
